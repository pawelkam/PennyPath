name: pennypath

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image digest}
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Host: postgres
      Database__Port: "5432"
      Database__Name: pennypath
      Database__Username: pennypath
      Database__PasswordFile: /run/secrets/postgres_password
      Proxy__KnownProxy: ${PROXY_IP:-172.30.90.2}
      DataProtection__KeysPath: /var/lib/pennypath/keys
    volumes:
      - app_keys:/var/lib/pennypath/keys
    networks:
      - default
      - edge
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: caddy:2.11.9-alpine
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      LAN_HOST: ${LAN_HOST:?Set LAN_HOST to a stable LAN address or hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    networks:
      edge:
        ipv4_address: ${PROXY_IP:-172.30.90.2}
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:18
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: pennypath
      POSTGRES_USER: pennypath
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennypath -d pennypath"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  app_keys:
  proxy_data:
  proxy_config:

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.90.0/24}
          ip_range: ${EDGE_IP_RANGE:-172.30.90.128/25}

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set the server-side password file path}
