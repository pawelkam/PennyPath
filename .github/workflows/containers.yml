name: Containers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the complete main pipeline, including publication and deployment.
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment transaction and shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck scripts/deploy.sh scripts/test-compose.sh
          python3 scripts/test-deploy.py
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image with backend tests, Vue tests and type checking
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: pennypath:ci
          cache-from: type=gha,scope=pennypath-arm64
          cache-to: type=gha,mode=max,scope=pennypath-arm64
      - name: Test trusted HTTPS, PostgreSQL migrations, sessions and failed deployments in isolation
        run: bash scripts/test-compose.sh

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the commit image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/pawelkam/pennypath:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pennypath-arm64
          cache-to: type=gha,mode=max,scope=pennypath-arm64

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, macOS, ARM64, pennypath-deploy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy the published digest with automatic rollback
        shell: bash
        env:
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
          DOCKER_CONTEXT: orbstack
        run: |
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:$PATH"
          docker info >/dev/null
          bash scripts/deploy.sh "ghcr.io/pawelkam/pennypath@$RELEASE_DIGEST"
